<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="forgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border radius -->
  <rect width="512" height="512" rx="112" fill="#ffffff" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4" />
  
  <!-- Sleek Forge Hexagon / Terminal Symbol -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Outer Shield / Hex Frame -->
    <path d="M 256 36 L 448 144 L 448 368 L 256 476 L 64 368 L 64 144 Z" 
          fill="url(#forgeGrad)" />
    <!-- Inner Dark Core for contrast -->
    <path d="M 256 76 L 412 164 L 412 348 L 256 436 L 100 348 L 100 164 Z" 
          fill="#0f172a" />
    <!-- Code Brackets & Anvil Spark -->
    <path d="M 180 200 L 130 256 L 180 312" 
          fill="none" stroke="#38bdf8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 332 200 L 382 256 L 332 312" 
          fill="none" stroke="#818cf8" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center AI Spark / Lightning Core -->
    <path d="M 268 180 L 224 260 L 260 260 L 244 332 L 296 248 L 256 248 Z" 
          fill="url(#accentGrad)" />
  </g>
</svg>
